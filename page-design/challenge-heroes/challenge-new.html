<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发起难题 — 难题英雄榜 — 无线AI极客汇</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#0d55c9', foreground: '#ffffff' },
            border: '#e2e8f0',
            background: '#f8fafc',
            foreground: '#0f172a',
            muted: { DEFAULT: '#f1f5f9', foreground: '#64748b' },
          },
          borderRadius: { lg: '0.625rem', xl: '0.75rem' },
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #0f172a; -webkit-font-smoothing: antialiased; }
    .editor-content:empty:before { content: attr(placeholder); color: #94a3b8; }
    .editor-content { min-height: 280px; outline: none; line-height: 1.7; }
    .editor-content p { margin-bottom: 0.75rem; }
    .editor-content blockquote { border-left: 3px solid #e2e8f0; padding-left: 1rem; color: #64748b; margin: 0.75rem 0; }
    .editor-content ul { list-style: disc; padding-left: 1.5rem; margin: 0.75rem 0; }
    .editor-content ol { list-style: decimal; padding-left: 1.5rem; margin: 0.75rem 0; }
    .editor-content pre { background: #f1f5f9; padding: 0.75rem; border-radius: 0.5rem; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.875rem; overflow-x: auto; }
    .editor-content code { background: #f1f5f9; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.875rem; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body class="min-h-screen">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-white/85 backdrop-blur-md border-b border-border/50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-2.5 font-bold text-lg text-foreground">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-sm">
            <i data-lucide="zap" class="w-5 h-5 text-white"></i>
          </div>
          <span>无线AI极客汇</span>
        </a>
        <div class="hidden md:flex items-center gap-1">
          <a href="index.html" class="px-2 py-2 text-sm font-medium text-muted-foreground hover:text-foreground rounded-md hover:bg-muted transition-colors">首页</a>
          <a href="intelligence.html" class="px-2 py-2 text-sm font-medium text-muted-foreground hover:text-foreground rounded-md hover:bg-muted transition-colors">情报局</a>
          <a href="courses.html" class="px-2 py-2 text-sm font-medium text-muted-foreground hover:text-foreground rounded-md hover:bg-muted transition-colors">课程</a>
          <a href="forum.html" class="px-2 py-2 text-sm font-medium text-muted-foreground hover:text-foreground rounded-md hover:bg-muted transition-colors">论坛</a>
          <a href="challenge-heroes.html" class="px-2 py-2 text-sm font-medium text-foreground bg-muted rounded-md">难题英雄榜</a>
          <a href="market.html" class="px-2 py-2 text-sm font-medium text-muted-foreground hover:text-foreground rounded-md hover:bg-muted transition-colors">Agent市场</a>
        </div>
        <div class="flex items-center gap-2">
          <button class="p-2 text-muted-foreground hover:text-foreground rounded-full hover:bg-muted transition-colors">
            <i data-lucide="search" class="w-4 h-4"></i>
          </button>
          <button class="hidden sm:flex p-2 text-muted-foreground hover:text-foreground rounded-full hover:bg-muted transition-colors">
            <i data-lucide="user" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="pt-16">
    <div class="w-full lg:w-2/3 xl:w-3/5 mx-auto px-4 sm:px-6 lg:px-8 py-8">

      <!-- Page Header -->
      <div class="mb-8">
        <div class="flex items-center gap-3 mb-3">
          <a href="challenge-heroes.html" class="inline-flex items-center justify-center w-8 h-8 rounded-lg text-muted-foreground hover:text-primary hover:bg-muted transition-colors" title="返回难题英雄榜">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
          </a>
          <div class="flex items-center gap-2 text-sm text-muted-foreground">
            <a href="challenge-heroes.html" class="hover:text-primary transition-colors">难题英雄榜</a>
            <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
            <span>发起难题</span>
          </div>
        </div>
        <h1 class="text-2xl font-bold text-foreground">发起难题</h1>
        <p class="text-sm text-muted-foreground mt-2">清晰描述你遇到的业务难题并设置悬赏积分，发布后进入「揭榜中」状态，等待英雄揭榜解题</p>
      </div>

      <!-- Form -->
      <form class="space-y-6" onsubmit="event.preventDefault();">

        <!-- Title -->
        <div>
          <label class="block text-sm font-medium text-foreground mb-2">
            难题题目 <span class="text-red-500">*</span>
          </label>
          <input type="text" placeholder="用一句话说清楚你遇到的难题，例如：高话务场景下基站节能与体验如何兼得？" maxlength="120"
            class="w-full px-4 py-3 text-sm border border-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors bg-white"
            oninput="document.getElementById('title-count').textContent = this.value.length + '/120'">
          <div class="flex justify-end mt-1.5">
            <span id="title-count" class="text-xs text-muted-foreground">0/120</span>
          </div>
        </div>

        <!-- Two columns: Category & Department -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <!-- Category -->
          <div>
            <label class="block text-sm font-medium text-foreground mb-2">
              问题类别 <span class="text-red-500">*</span>
            </label>
            <select class="w-full px-4 py-3 text-sm border border-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors bg-white appearance-none cursor-pointer">
              <option value="" disabled selected>请选择问题类别</option>
              <option value="energy">基站节能</option>
              <option value="protocol">协议分析</option>
              <option value="optimization">网络优化</option>
              <option value="ai-ops">AI运维</option>
              <option value="mass-test">大规模测试</option>
              <option value="channel">信道建模</option>
              <option value="other">其他</option>
            </select>
          </div>

          <!-- Department -->
          <div>
            <label class="block text-sm font-medium text-foreground mb-2">
              所属部门 <span class="text-red-500">*</span>
            </label>
            <select class="w-full px-4 py-3 text-sm border border-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors bg-white appearance-none cursor-pointer">
              <option value="" disabled selected>请选择难题所属部门</option>
              <option value="wireless-research">无线网络研究部</option>
              <option value="base-station">基站平台部</option>
              <option value="core-network">核心网软件部</option>
              <option value="terminal-protocol">终端协议栈部</option>
              <option value="test-verify">测试与验证部</option>
            </select>
          </div>
        </div>

        <!-- Score: evaluated by platform admin, publisher only self-assesses difficulty -->
        <div>
          <label class="block text-sm font-medium text-foreground mb-2">
            悬赏分值
          </label>
          <div class="border border-border rounded-xl bg-white px-4 py-4">
            <div class="flex items-center gap-3">
              <div class="w-9 h-9 rounded-lg bg-amber-50 flex items-center justify-center flex-shrink-0">
                <i data-lucide="coins" class="w-4 h-4 text-amber-600"></i>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-foreground">由平台管理员评审后确定</p>
                <p class="text-xs text-muted-foreground">根据难度自评、业务影响面和紧迫度综合评定，参考区间 100–800 分</p>
              </div>
              <span class="text-xs font-medium px-2 py-1 rounded-md bg-muted text-muted-foreground flex-shrink-0">发布后评定</span>
            </div>
            <div class="mt-4 pt-4 border-t border-border/60">
              <p class="text-xs font-medium text-foreground mb-2">
                难度自评 <span class="text-red-500">*</span>
                <span class="font-normal text-muted-foreground ml-1">供管理员定分参考</span>
              </p>
              <input type="hidden" id="difficulty-input" value="">
              <div class="flex flex-wrap gap-2">
                <button type="button" data-value="light" class="difficulty-chip px-3 py-1.5 text-xs font-medium border border-border rounded-md text-muted-foreground hover:border-primary/40 hover:text-primary transition-colors" onclick="setDifficulty(this)">轻微 · 单点问题</button>
                <button type="button" data-value="normal" class="difficulty-chip px-3 py-1.5 text-xs font-medium border border-border rounded-md text-muted-foreground hover:border-primary/40 hover:text-primary transition-colors" onclick="setDifficulty(this)">一般 · 影响单模块</button>
                <button type="button" data-value="hard" class="difficulty-chip px-3 py-1.5 text-xs font-medium border border-border rounded-md text-muted-foreground hover:border-primary/40 hover:text-primary transition-colors" onclick="setDifficulty(this)">复杂 · 跨模块协同</button>
                <button type="button" data-value="critical" class="difficulty-chip px-3 py-1.5 text-xs font-medium border border-border rounded-md text-muted-foreground hover:border-primary/40 hover:text-primary transition-colors" onclick="setDifficulty(this)">重大 · 影响现网业务</button>
              </div>
            </div>
            <div class="flex items-center gap-2 text-xs text-muted-foreground mt-4">
              <i data-lucide="shield-check" class="w-3.5 h-3.5 text-emerald-500 flex-shrink-0"></i>
              普通用户（含发布者）不可自定义分值，避免刷分等不公平行为；超管可在管理后台审核并调整分值
            </div>
          </div>
        </div>

        <!-- Rich Text Editor -->
        <div>
          <label class="block text-sm font-medium text-foreground mb-2">
            难题内容 <span class="text-red-500">*</span>
          </label>
          <div id="editor-rich" class="bg-white border border-border rounded-xl overflow-hidden">
            <!-- Toolbar -->
            <div class="flex items-center gap-1 px-3 py-2 border-b border-border bg-muted/30">
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('bold')">
                <i data-lucide="bold" class="w-4 h-4"></i>
              </button>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('italic')">
                <i data-lucide="italic" class="w-4 h-4"></i>
              </button>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('underline')">
                <i data-lucide="underline" class="w-4 h-4"></i>
              </button>
              <div class="w-px h-4 bg-border mx-1"></div>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('insertUnorderedList')">
                <i data-lucide="list" class="w-4 h-4"></i>
              </button>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('insertOrderedList')">
                <i data-lucide="list-ordered" class="w-4 h-4"></i>
              </button>
              <div class="w-px h-4 bg-border mx-1"></div>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('formatBlock', 'BLOCKQUOTE')">
                <i data-lucide="quote" class="w-4 h-4"></i>
              </button>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="insertCodeBlock()">
                <i data-lucide="code-2" class="w-4 h-4"></i>
              </button>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('createLink')">
                <i data-lucide="link" class="w-4 h-4"></i>
              </button>
              <div class="flex-1"></div>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('undo')">
                <i data-lucide="undo-2" class="w-4 h-4"></i>
              </button>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('redo')">
                <i data-lucide="redo-2" class="w-4 h-4"></i>
              </button>
            </div>
            <!-- Content Area -->
            <div id="rich-content" contenteditable="true" placeholder="建议按以下结构描述，帮助揭榜人快速理解：&#10;&#10;【背景与场景】问题发生在什么业务场景中&#10;【现状与痛点】目前怎么解决的，卡在哪里&#10;【期望目标】希望达到什么效果，如何验收&#10;【已有材料】相关数据、日志、文档情况"
              class="editor-content px-4 py-4 text-sm"></div>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-between pt-4 border-t border-border">
          <div class="text-xs text-muted-foreground">
            <span class="flex items-center gap-1.5">
              <i data-lucide="info" class="w-3.5 h-3.5"></i>
              发布后难题进入「揭榜中」状态，可在我的发布中随时查看进展
            </span>
          </div>
          <div class="flex items-center gap-3">
            <a href="challenge-heroes.html" class="px-5 py-2.5 text-sm font-medium text-muted-foreground hover:text-foreground rounded-lg hover:bg-muted transition-colors">
              取消
            </a>
            <button type="submit" class="px-6 py-2.5 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primary/90 transition-colors shadow-sm">
              发布难题
            </button>
          </div>
        </div>

      </form>
    </div>
  </div>

  <script>
    // Initialize icons
    lucide.createIcons();

    // Rich text commands
    function execCmd(command, value = null) {
      document.execCommand(command, false, value);
      document.getElementById('rich-content').focus();
    }

    function insertCodeBlock() {
      const sel = window.getSelection();
      const range = sel.getRangeAt(0);
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.textContent = '// 在此输入代码';
      pre.appendChild(code);
      range.deleteContents();
      range.insertNode(pre);
      range.collapse(false);
      // Add empty paragraph after
      const p = document.createElement('p');
      p.innerHTML = '<br>';
      pre.parentNode.insertBefore(p, pre.nextSibling);
      sel.removeAllRanges();
      sel.addRange(range);
      document.getElementById('rich-content').focus();
    }

    // Difficulty self-assessment chips
    function setDifficulty(chip) {
      document.getElementById('difficulty-input').value = chip.dataset.value;
      document.querySelectorAll('.difficulty-chip').forEach(function(item) {
        const active = item === chip;
        item.classList.toggle('bg-primary/10', active);
        item.classList.toggle('text-primary', active);
        item.classList.toggle('border-primary/40', active);
        item.classList.toggle('text-muted-foreground', !active);
      });
    }
  </script>
</body>
</html>
