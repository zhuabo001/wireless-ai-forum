<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发起话题 — AI论坛 — 无线AI极客汇</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: { DEFAULT: '#0d55c9', foreground: '#ffffff' },
            border: '#e2e8f0',
            background: '#f8fafc',
            foreground: '#0f172a',
            muted: { DEFAULT: '#f1f5f9', foreground: '#64748b' },
          },
          borderRadius: { lg: '0.625rem', xl: '0.75rem' },
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #0f172a; -webkit-font-smoothing: antialiased; }
    .editor-content:empty:before { content: attr(placeholder); color: #94a3b8; }
    .editor-content { min-height: 240px; outline: none; line-height: 1.7; }
    .editor-content p { margin-bottom: 0.75rem; }
    .editor-content blockquote { border-left: 3px solid #e2e8f0; padding-left: 1rem; color: #64748b; margin: 0.75rem 0; }
    .editor-content ul { list-style: disc; padding-left: 1.5rem; margin: 0.75rem 0; }
    .editor-content ol { list-style: decimal; padding-left: 1.5rem; margin: 0.75rem 0; }
    .editor-content pre { background: #f1f5f9; padding: 0.75rem; border-radius: 0.5rem; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.875rem; overflow-x: auto; }
    .editor-content code { background: #f1f5f9; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 0.875rem; }
    .tag-pill { animation: tagIn 0.15s ease-out; }
    @keyframes tagIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  </style>
</head>
<body class="min-h-screen">

  <!-- Navbar -->
  <nav class="fixed top-0 left-0 right-0 z-50 bg-white/85 backdrop-blur-md border-b border-border/50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16">
        <a href="index.html" class="flex items-center gap-2.5 font-bold text-lg text-foreground">
          <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-sm">
            <i data-lucide="zap" class="w-5 h-5 text-white"></i>
          </div>
          <span>无线AI极客汇</span>
        </a>
        <div class="hidden md:flex items-center gap-1">
          <a href="index.html" class="px-2 py-2 text-sm font-medium text-muted-foreground hover:text-foreground rounded-md hover:bg-muted transition-colors">首页</a>
          <a href="intelligence.html" class="px-2 py-2 text-sm font-medium text-muted-foreground hover:text-foreground rounded-md hover:bg-muted transition-colors">情报局</a>
          <a href="courses.html" class="px-2 py-2 text-sm font-medium text-muted-foreground hover:text-foreground rounded-md hover:bg-muted transition-colors">课程</a>
          <a href="forum.html" class="px-2 py-2 text-sm font-medium text-foreground bg-muted rounded-md">论坛</a>
          <a href="market.html" class="px-2 py-2 text-sm font-medium text-muted-foreground hover:text-foreground rounded-md hover:bg-muted transition-colors">Agent市场</a>
        </div>
        <div class="flex items-center gap-2">
          <button class="p-2 text-muted-foreground hover:text-foreground rounded-full hover:bg-muted transition-colors">
            <i data-lucide="search" class="w-4 h-4"></i>
          </button>
          <button class="hidden sm:flex p-2 text-muted-foreground hover:text-foreground rounded-full hover:bg-muted transition-colors">
            <i data-lucide="user" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="pt-16">
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">

      <!-- Page Header -->
      <div class="mb-8">
        <div class="flex items-center gap-2 text-sm text-muted-foreground mb-2">
          <a href="forum.html" class="hover:text-primary transition-colors">AI论坛</a>
          <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
          <span>发起话题</span>
        </div>
        <h1 class="text-2xl font-bold text-foreground">发起新话题</h1>
      </div>

      <!-- Form -->
      <form class="space-y-6" onsubmit="event.preventDefault();">

        <!-- Title -->
        <div>
          <label class="block text-sm font-medium text-foreground mb-2">
            帖子标题 <span class="text-red-500">*</span>
          </label>
          <input type="text" placeholder="用一句话清晰描述你的问题或分享内容" maxlength="120"
            class="w-full px-4 py-3 text-sm border border-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors bg-white"
            oninput="document.getElementById('title-count').textContent = this.value.length + '/120'">
          <div class="flex justify-end mt-1.5">
            <span id="title-count" class="text-xs text-muted-foreground">0/120</span>
          </div>
        </div>

        <!-- Summary -->
        <div>
          <label class="block text-sm font-medium text-foreground mb-2">
            内容概述
          </label>
          <textarea placeholder="用几句话概括帖子核心内容，帮助他人快速了解" rows="3" maxlength="300"
            class="w-full px-4 py-3 text-sm border border-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors bg-white resize-none"
            oninput="document.getElementById('summary-count').textContent = this.value.length + '/300'"></textarea>
          <div class="flex justify-end mt-1.5">
            <span id="summary-count" class="text-xs text-muted-foreground">0/300</span>
          </div>
        </div>

        <!-- Two columns: Category & Tags -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <!-- Category -->
          <div>
            <label class="block text-sm font-medium text-foreground mb-2">
              话题领域 <span class="text-red-500">*</span>
            </label>
            <select class="w-full px-4 py-3 text-sm border border-border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary/20 focus:border-primary transition-colors bg-white appearance-none cursor-pointer">
              <option value="" disabled selected>请选择领域</option>
              <option value="help">求助</option>
              <option value="share">分享</option>
              <option value="practice">实践</option>
              <option value="discuss">讨论</option>
            </select>
          </div>

          <!-- Tags -->
          <div>
            <label class="block text-sm font-medium text-foreground mb-2">
              标签
            </label>
            <div class="w-full px-3 py-2 text-sm border border-border rounded-xl focus-within:ring-2 focus-within:ring-primary/20 focus-within:border-primary transition-colors bg-white">
              <div id="tag-container" class="flex flex-wrap items-center gap-2">
                <!-- Tags will be inserted here -->
                <input type="text" id="tag-input" placeholder="输入标签后回车添加"
                  class="flex-1 min-w-[120px] py-1 outline-none bg-transparent text-sm"
                  onkeydown="handleTagInput(event)">
              </div>
            </div>
            <p class="text-xs text-muted-foreground mt-1.5">最多添加 5 个标签，回车确认</p>
          </div>
        </div>

        <!-- Cover Image Upload -->
        <div>
          <label class="block text-sm font-medium text-foreground mb-2">
            封面图片
          </label>
          <div id="upload-area" class="relative border-2 border-dashed border-border rounded-xl bg-white p-8 text-center cursor-pointer hover:border-primary/40 hover:bg-primary/5 transition-colors"
            onclick="document.getElementById('cover-input').click()"
            ondragover="event.preventDefault(); this.classList.add('border-primary', 'bg-primary/5');"
            ondragleave="this.classList.remove('border-primary', 'bg-primary/5');"
            ondrop="event.preventDefault(); this.classList.remove('border-primary', 'bg-primary/5'); handleFileDrop(event);">
            <input type="file" id="cover-input" accept="image/*" class="hidden" onchange="handleFileSelect(this)">
            <div id="upload-placeholder">
              <div class="w-12 h-12 rounded-full bg-muted flex items-center justify-center mx-auto mb-3">
                <i data-lucide="image-plus" class="w-5 h-5 text-muted-foreground"></i>
              </div>
              <p class="text-sm text-foreground font-medium mb-1">点击或拖拽上传封面</p>
              <p class="text-xs text-muted-foreground">支持 JPG、PNG 格式，最大 5MB</p>
            </div>
            <div id="upload-preview" class="hidden">
              <img id="preview-img" src="" alt="封面预览" class="max-h-48 mx-auto rounded-lg object-cover">
              <button type="button" class="mt-3 text-xs text-red-500 hover:text-red-600 font-medium" onclick="event.stopPropagation(); removeCover();">删除图片</button>
            </div>
          </div>
        </div>

        <!-- Editor -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label class="block text-sm font-medium text-foreground">
              正文内容 <span class="text-red-500">*</span>
            </label>
            <!-- Editor Switch -->
            <div class="flex items-center bg-white border border-border rounded-lg p-0.5">
              <button type="button" id="btn-rich" class="px-3 py-1.5 text-xs font-medium rounded-md bg-primary text-white transition-colors" onclick="switchEditor('rich')">
                <span class="flex items-center gap-1"><i data-lucide="type" class="w-3 h-3"></i>富文本</span>
              </button>
              <button type="button" id="btn-md" class="px-3 py-1.5 text-xs font-medium rounded-md text-muted-foreground hover:text-foreground transition-colors" onclick="switchEditor('md')">
                <span class="flex items-center gap-1"><i data-lucide="markdown" class="w-3 h-3"></i>Markdown</span>
              </button>
            </div>
          </div>

          <!-- Rich Text Editor -->
          <div id="editor-rich" class="bg-white border border-border rounded-xl overflow-hidden">
            <!-- Toolbar -->
            <div class="flex items-center gap-1 px-3 py-2 border-b border-border bg-muted/30">
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('bold')">
                <i data-lucide="bold" class="w-4 h-4"></i>
              </button>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('italic')">
                <i data-lucide="italic" class="w-4 h-4"></i>
              </button>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('underline')">
                <i data-lucide="underline" class="w-4 h-4"></i>
              </button>
              <div class="w-px h-4 bg-border mx-1"></div>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('insertUnorderedList')">
                <i data-lucide="list" class="w-4 h-4"></i>
              </button>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('insertOrderedList')">
                <i data-lucide="list-ordered" class="w-4 h-4"></i>
              </button>
              <div class="w-px h-4 bg-border mx-1"></div>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('formatBlock', 'BLOCKQUOTE')">
                <i data-lucide="quote" class="w-4 h-4"></i>
              </button>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="insertCodeBlock()">
                <i data-lucide="code-2" class="w-4 h-4"></i>
              </button>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('createLink')">
                <i data-lucide="link" class="w-4 h-4"></i>
              </button>
              <div class="flex-1"></div>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('undo')">
                <i data-lucide="undo-2" class="w-4 h-4"></i>
              </button>
              <button type="button" class="p-1.5 rounded hover:bg-muted transition-colors text-muted-foreground hover:text-foreground" onclick="execCmd('redo')">
                <i data-lucide="redo-2" class="w-4 h-4"></i>
              </button>
            </div>
            <!-- Content Area -->
            <div id="rich-content" contenteditable="true" placeholder="在这里详细描述你的问题、经验或想法..."
              class="editor-content px-4 py-4 text-sm"></div>
          </div>

          <!-- Markdown Editor -->
          <div id="editor-md" class="hidden">
            <div class="bg-white border border-border rounded-xl overflow-hidden">
              <div class="flex items-center justify-between px-3 py-2 border-b border-border bg-muted/30">
                <span class="text-xs text-muted-foreground">支持标准 Markdown 语法</span>
                <button type="button" class="text-xs text-primary hover:underline" onclick="toggleMdPreview()">
                  <span id="preview-label">预览</span>
                </button>
              </div>
              <div class="grid" id="md-grid" style="grid-template-columns: 1fr;">
                <textarea id="md-textarea" placeholder="使用 Markdown 编写你的内容...&#10;&#10;## 标题&#10;- 列表项&#10;**粗体** *斜体* `代码`&#10;&#10;```&#10;代码块&#10;```"
                  class="w-full px-4 py-4 text-sm border-0 outline-none resize-none font-mono bg-white" rows="12"
                  oninput="updateMdPreview()"></textarea>
                <div id="md-preview" class="hidden px-4 py-4 text-sm border-l border-border bg-white prose max-w-none" style="min-height: 240px;">
                </div>
              </div>
            </div>
            <!-- Markdown Shortcuts -->
            <div class="flex flex-wrap gap-2 mt-2">
              <button type="button" class="px-2 py-1 text-xs bg-white border border-border rounded-md text-muted-foreground hover:text-foreground hover:border-primary/30 transition-colors" onclick="insertMd('## ')">H2</button>
              <button type="button" class="px-2 py-1 text-xs bg-white border border-border rounded-md text-muted-foreground hover:text-foreground hover:border-primary/30 transition-colors" onclick="insertMd('**', '**')">粗体</button>
              <button type="button" class="px-2 py-1 text-xs bg-white border border-border rounded-md text-muted-foreground hover:text-foreground hover:border-primary/30 transition-colors" onclick="insertMd('*', '*')">斜体</button>
              <button type="button" class="px-2 py-1 text-xs bg-white border border-border rounded-md text-muted-foreground hover:text-foreground hover:border-primary/30 transition-colors" onclick="insertMd('`', '`')">行内代码</button>
              <button type="button" class="px-2 py-1 text-xs bg-white border border-border rounded-md text-muted-foreground hover:text-foreground hover:border-primary/30 transition-colors" onclick="insertMd('\n```\n', '\n```\n')">代码块</button>
              <button type="button" class="px-2 py-1 text-xs bg-white border border-border rounded-md text-muted-foreground hover:text-foreground hover:border-primary/30 transition-colors" onclick="insertMd('- ')">列表</button>
              <button type="button" class="px-2 py-1 text-xs bg-white border border-border rounded-md text-muted-foreground hover:text-foreground hover:border-primary/30 transition-colors" onclick="insertMd('> ')">引用</button>
              <button type="button" class="px-2 py-1 text-xs bg-white border border-border rounded-md text-muted-foreground hover:text-foreground hover:border-primary/30 transition-colors" onclick="insertMd('[', '](url)')">链接</button>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="flex items-center justify-between pt-4 border-t border-border">
          <div class="text-xs text-muted-foreground">
            <span class="flex items-center gap-1.5">
              <i data-lucide="info" class="w-3.5 h-3.5"></i>
              发布前请确认内容符合社区规范
            </span>
          </div>
          <div class="flex items-center gap-3">
            <a href="forum.html" class="px-5 py-2.5 text-sm font-medium text-muted-foreground hover:text-foreground rounded-lg hover:bg-muted transition-colors">
              取消
            </a>
            <button type="submit" class="px-6 py-2.5 text-sm font-medium text-white bg-primary rounded-lg hover:bg-primary/90 transition-colors shadow-sm">
              发布话题
            </button>
          </div>
        </div>

      </form>
    </div>
  </div>

  <script>
    // Initialize icons
    lucide.createIcons();

    // Editor switch
    function switchEditor(mode) {
      const richEditor = document.getElementById('editor-rich');
      const mdEditor = document.getElementById('editor-md');
      const btnRich = document.getElementById('btn-rich');
      const btnMd = document.getElementById('btn-md');

      if (mode === 'rich') {
        richEditor.classList.remove('hidden');
        mdEditor.classList.add('hidden');
        btnRich.classList.add('bg-primary', 'text-white');
        btnRich.classList.remove('text-muted-foreground', 'hover:text-foreground');
        btnMd.classList.remove('bg-primary', 'text-white');
        btnMd.classList.add('text-muted-foreground', 'hover:text-foreground');
      } else {
        richEditor.classList.add('hidden');
        mdEditor.classList.remove('hidden');
        btnMd.classList.add('bg-primary', 'text-white');
        btnMd.classList.remove('text-muted-foreground', 'hover:text-foreground');
        btnRich.classList.remove('bg-primary', 'text-white');
        btnRich.classList.add('text-muted-foreground', 'hover:text-foreground');
      }
      lucide.createIcons();
    }

    // Rich text commands
    function execCmd(command, value = null) {
      document.execCommand(command, false, value);
      document.getElementById('rich-content').focus();
    }

    function insertCodeBlock() {
      const sel = window.getSelection();
      const range = sel.getRangeAt(0);
      const pre = document.createElement('pre');
      const code = document.createElement('code');
      code.textContent = '// 在此输入代码';
      pre.appendChild(code);
      range.deleteContents();
      range.insertNode(pre);
      range.collapse(false);
      // Add empty paragraph after
      const p = document.createElement('p');
      p.innerHTML = '<br>';
      pre.parentNode.insertBefore(p, pre.nextSibling);
      sel.removeAllRanges();
      sel.addRange(range);
      document.getElementById('rich-content').focus();
    }

    // Tags
    let tags = [];
    function handleTagInput(event) {
      const input = event.target;
      if (event.key === 'Enter' || event.key === ',') {
        event.preventDefault();
        const value = input.value.trim().replace(/,/g, '');
        if (value && tags.length < 5 && !tags.includes(value)) {
          tags.push(value);
          renderTags();
        }
        input.value = '';
      }
      if (event.key === 'Backspace' && input.value === '' && tags.length > 0) {
        tags.pop();
        renderTags();
      }
    }

    function renderTags() {
      const container = document.getElementById('tag-container');
      const input = document.getElementById('tag-input');
      container.innerHTML = '';
      tags.forEach((tag, index) => {
        const pill = document.createElement('span');
        pill.className = 'tag-pill inline-flex items-center gap-1 px-2.5 py-1 text-xs font-medium bg-primary/10 text-primary rounded-md';
        pill.innerHTML = `<span>${tag}</span><button type="button" class="hover:text-primary/70" onclick="removeTag(${index})"><i data-lucide="x" class="w-3 h-3"></i></button>`;
        container.appendChild(pill);
      });
      container.appendChild(input);
      input.placeholder = tags.length >= 5 ? '' : '输入标签后回车添加';
      lucide.createIcons();
    }

    function removeTag(index) {
      tags.splice(index, 1);
      renderTags();
    }

    // Cover upload
    function handleFileSelect(input) {
      if (input.files && input.files[0]) {
        showPreview(input.files[0]);
      }
    }

    function handleFileDrop(event) {
      const files = event.dataTransfer.files;
      if (files.length > 0) {
        showPreview(files[0]);
      }
    }

    function showPreview(file) {
      if (!file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('preview-img').src = e.target.result;
        document.getElementById('upload-placeholder').classList.add('hidden');
        document.getElementById('upload-preview').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function removeCover() {
      document.getElementById('cover-input').value = '';
      document.getElementById('upload-placeholder').classList.remove('hidden');
      document.getElementById('upload-preview').classList.add('hidden');
    }

    // Markdown helpers
    function insertMd(before, after = '') {
      const ta = document.getElementById('md-textarea');
      const start = ta.selectionStart;
      const end = ta.selectionEnd;
      const text = ta.value;
      const selected = text.substring(start, end);
      ta.value = text.substring(0, start) + before + selected + after + text.substring(end);
      ta.selectionStart = start + before.length;
      ta.selectionEnd = start + before.length + selected.length;
      ta.focus();
      updateMdPreview();
    }

    let previewOpen = false;
    function toggleMdPreview() {
      previewOpen = !previewOpen;
      const preview = document.getElementById('md-preview');
      const grid = document.getElementById('md-grid');
      const label = document.getElementById('preview-label');
      if (previewOpen) {
        preview.classList.remove('hidden');
        grid.style.gridTemplateColumns = '1fr 1fr';
        label.textContent = '关闭预览';
      } else {
        preview.classList.add('hidden');
        grid.style.gridTemplateColumns = '1fr';
        label.textContent = '预览';
      }
      updateMdPreview();
    }

    function updateMdPreview() {
      if (!previewOpen) return;
      const text = document.getElementById('md-textarea').value;
      // Simple markdown to HTML conversion for preview
      let html = text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/^### (.*$)/gim, '<h3>$1</h3>')
        .replace(/^## (.*$)/gim, '<h2>$1</h2>')
        .replace(/^# (.*$)/gim, '<h1>$1</h1>')
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/^\> (.*$)/gim, '<blockquote>$1</blockquote>')
        .replace(/^\- (.*$)/gim, '<ul><li>$1</li></ul>')
        .replace(/^\d+\. (.*$)/gim, '<ol><li>$1</li></ol>')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" class="text-primary underline">$1</a>')
        .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
        .replace(/\n/g, '<br>');
      // Merge consecutive lists
      html = html.replace(/<\/ul>\s*<ul>/g, '').replace(/<\/ol>\s*<ol>/g, '');
      document.getElementById('md-preview').innerHTML = html;
    }
  </script>
</body>
</html>
